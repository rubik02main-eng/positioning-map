<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人物ポジショニングマップ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161718" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人物マップ">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* 配色はOGAデザインシステムに合わせる: 黒とグレーのモノトーン、オレンジ(nozzle)はハイライトにだけ使う。影は使わない。 */
:root{
  --plate:#f4f4f3; --raised:#ffffff; --line:#dcdddb; --grid:#e8e8e6; --plot:#fafaf9;
  --ink-strong:#2a2c2e; --ink:#3a3c3f; --muted:#6b6e72; --dot:#8a8d91;
  --noz:#f26522; --noz-text:#b4470f; --noz-soft:#fce4d6; --on-noz:#1e1f21;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --display:"Jost","Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plate:#161718; --raised:#202224; --line:#313336; --grid:#292b2d; --plot:#1b1c1e;
    --ink-strong:#ecedee; --ink:#d2d4d6; --muted:#9a9da1; --dot:#7c7f84;
    --noz-text:#ff8a4c; --noz-soft:#3a2014; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plate:#161718; --raised:#202224; --line:#313336; --grid:#292b2d; --plot:#1b1c1e;
  --ink-strong:#ecedee; --ink:#d2d4d6; --muted:#9a9da1; --dot:#7c7f84;
  --noz-text:#ff8a4c; --noz-soft:#3a2014; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plate);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{font-size:20px;margin:0;line-height:1.3;color:var(--ink-strong);letter-spacing:.06em;font-weight:500}
h1::after{content:"";display:block;width:36px;height:3px;background:var(--noz);margin-top:6px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--raised);border-radius:2px;padding:8px 14px;min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.main{background:var(--ink-strong);color:var(--plate);border-color:var(--ink-strong)}
.btn:focus-visible,.q:focus-visible,.xbtn:focus-visible{outline:2px solid var(--noz);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 12px;margin-bottom:12px}
.bar .grp{display:flex;align-items:center;gap:8px}
.bar .axis{color:var(--muted);font-size:13px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:36px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw .tr::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--raised);transition:transform .15s}
.sw input:checked + .tr{background:var(--ink-strong)}
.sw input:checked + .tr::after{transform:translateX(16px);background:var(--plate)}
.sw input:focus-visible + .tr{outline:2px solid var(--noz);outline-offset:2px}
.q{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);background:none;font-size:13px;font-weight:700;line-height:1;padding:0;flex:none}
.q:hover{border-color:var(--ink-strong);color:var(--ink-strong)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:12px}
#map svg{display:block;width:100%;height:auto;touch-action:manipulation}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0;line-height:1.6}
.empty{color:var(--muted);padding:14px 4px;font-size:14px}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ph input{flex:1;min-width:0;font-size:19px;font-weight:700;color:var(--ink-strong);border:1px solid transparent;background:none;border-radius:2px;padding:4px 8px}
.ph input:hover,.ph input:focus{border-color:var(--line);background:var(--plate)}
.xbtn{border:0;background:none;font-size:22px;line-height:1;padding:6px 10px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-bottom:10px;color:var(--muted)}
.badge.tr{color:var(--noz-text);border-color:var(--noz-text)}
.sec{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.sec h3{font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:8px;color:var(--ink-strong)}
.slide{display:flex;align-items:center;gap:10px}
.slide input[type=range]{flex:1;min-width:0;accent-color:var(--ink-strong);height:32px}
.slide output{font-weight:700;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
.chk{display:flex;align-items:center;gap:10px;min-height:38px}
.chk input{width:20px;height:20px;accent-color:var(--ink-strong)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--plate);border-radius:2px;padding:8px;font-size:15px;resize:vertical}
.lrow{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.lrow .l1{display:flex;align-items:center;gap:8px}
.lrow .nm{border:0;background:none;font-weight:700;padding:4px 0;text-align:left;flex:1;min-width:0;color:var(--ink-strong);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.lrow .snum{width:4.2em;border:1px solid var(--line);background:var(--plate);border-radius:2px;padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
.lrow input[type=range]{width:100%;accent-color:var(--ink-strong);height:32px;margin-top:2px}
.lrow .tier{font-size:13px;color:var(--muted)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow select{flex:1;min-width:0;border:1px solid var(--line);background:var(--plate);border-radius:2px;padding:8px;min-height:42px}
.hist{list-style:none;margin:0;padding:0;font-size:13px}
.hist li{display:flex;gap:10px;padding:4px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);text-decoration:underline;padding:8px 0;min-height:40px}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--raised);color:var(--ink);padding:0;width:min(540px,calc(100vw - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:16px}
.dlg h2{font-size:16px;margin:0 0 8px;color:var(--ink-strong)}
.dlg h3{font-size:14px;margin:14px 0 6px;color:var(--ink-strong)}
.dlg p{margin:0 0 10px;font-size:14px}
.dlg table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.dlg td,.dlg th{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.dlg th{font-size:12px;color:var(--muted);font-weight:500}
.dlg tr.now td{background:var(--noz-soft);font-weight:700;color:var(--ink-strong)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.dlg .acts.l{justify-content:flex-start}
.gs{width:4.2em;border:1px solid var(--line);background:var(--plate);border-radius:2px;padding:4px 6px;text-align:right}
.gt{width:100%;border:1px solid var(--line);background:var(--plate);border-radius:2px;padding:4px 8px}
.stl{max-height:40vh;overflow:auto}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>人物ポジショニングマップ</h1>
    <div class="acts">
      <button class="btn main" id="b-add">＋ 人を追加</button>
      <button class="btn" id="b-png">画像で保存</button>
      <button class="btn" id="b-set">設定</button>
    </div>
  </div>

  <div class="bar">
    <div class="grp"><span class="axis">縦軸 大切にしたい</span><button class="q" data-help="axisE" aria-label="縦軸の説明">?</button></div>
    <div class="grp"><span class="axis">横軸 大切にすべき</span><button class="q" data-help="axisO" aria-label="横軸の説明">?</button></div>
    <div class="grp">
      <label class="sw"><input type="checkbox" id="t-links" checked><span class="tr"></span>つながりの線</label>
      <button class="q" data-help="links" aria-label="つながりの説明">?</button>
    </div>
    <div class="grp">
      <label class="sw"><input type="checkbox" id="t-trail" checked><span class="tr"></span>動きの軌跡</label>
      <button class="q" data-help="trail" aria-label="軌跡の説明">?</button>
    </div>
    <div class="grp"><span class="axis">ハイライト</span><button class="q" data-help="highlight" aria-label="ハイライトの説明">?</button></div>
  </div>

  <div class="grid">
    <section class="card">
      <div id="map"></div>
      <p class="hint">点を押すと、その人とつながる人が濃くなります。線の太さと濃さがつながりの強さ(0〜100)です。</p>
    </section>
    <aside class="card" id="panel" aria-live="polite"></aside>
  </div>
</div>

<dialog id="help"><div class="dlg">
  <h2 id="help-t"></h2>
  <div id="help-b"></div>
  <div class="acts"><button class="btn hidden" id="help-set">目安を変更する</button><button class="btn main" id="help-x">閉じる</button></div>
</div></dialog>

<dialog id="set"><div class="dlg">
  <h2>設定</h2>
  <h3>関係の強さの目安</h3>
  <p>「?」を押したときに出る説明です。左の数字からその段階が始まります。</p>
  <div class="stl"><table><thead><tr><th>から</th><th>説明</th><th></th></tr></thead><tbody id="set-rows"></tbody></table></div>
  <div class="acts l"><button class="btn" id="set-add">段階を追加</button><button class="btn" id="set-reset">初期値に戻す</button></div>
  <h3>データ(この端末の中だけに保存されています)</h3>
  <p>バックアップは、人・つながり・履歴・目安をまとめた1つのファイルです。</p>
  <div class="acts l">
    <button class="btn" id="s-export">バックアップを書き出す</button>
    <button class="btn" id="s-import">バックアップを読み込む</button>
    <button class="btn" id="s-wipe">全データを削除</button>
    <input type="file" id="s-file" accept=".json,application/json" class="hidden">
  </div>
  <p id="s-msg" style="font-size:13px;color:var(--muted);margin-top:8px"></p>
  <div class="acts"><button class="btn main" id="set-x">閉じる</button></div>
</div></dialog>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const fmtD=d=>d.replace(/-/g,'/');
const fmtJP=d=>d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes())+' 時点';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const OPP=['イベントに誘える','仕事の可能性がある','人を紹介してくれそう','情報や知識をくれる'];
const Q={tr:['一番大事な人','一緒に挑戦したい'],tl:['純粋に大切な人','損得で見ない'],br:['縁をつなぐ人','定期的に連絡・誘う'],bl:['自然体でいい人','無理せず付き合う']};
const DEF_GUIDE=[
 {s:0,t:'知らない'},{s:1,t:'名前を知っている'},{s:11,t:'Instagramなどでつながっている'},
 {s:21,t:'会話をしたことがある'},{s:31,t:'何度か会話したことがある'},{s:41,t:'個別にやりとりしたことがある'},
 {s:51,t:'二人など少人数で会ったことがある'},{s:61,t:'何度か会ったことがある'},{s:71,t:'悩みや本音を話せる'},
 {s:81,t:'困ったときに頼れる'},{s:91,t:'親友'},{s:100,t:'家族レベル'}];
const cloneGuide=()=>DEF_GUIDE.map(g=>Object.assign({},g));

/* ---------- 保存(ここだけがデータの出入り口。後でSupabaseに差し替える) ---------- */
const KEY='positioning-map.v2';
const S={people:[],links:{},hist:{},guide:cloneGuide(),showLinks:true,showTrail:true,sel:null};
let warned=false;
function snapshot(){return {v:2,people:S.people,links:S.links,hist:S.hist,guide:S.guide,showLinks:S.showLinks,showTrail:S.showTrail}}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(snapshot()))}
  catch(e){if(!warned){warned=true;alert('この環境ではデータを保存できません。設定からバックアップを書き出してください。')}}
}
function apply(d){
  if(!d||!Array.isArray(d.people))return false;
  S.people=d.people.map(p=>({id:String(p.id),name:String(p.name||'名前なし'),e:Math.min(5,Math.max(1,+p.e||3)),
    opp:[0,1,2,3].map(i=>p.opp&&p.opp[i]?1:0),memo:String(p.memo||'')}));
  S.links=d.links&&typeof d.links==='object'?d.links:{};
  S.hist=d.hist&&typeof d.hist==='object'?d.hist:{};
  S.guide=Array.isArray(d.guide)&&d.guide.length&&d.guide[0].s===0?d.guide:cloneGuide();
  S.showLinks=d.showLinks!==false;S.showTrail=d.showTrail!==false;
  return true;
}
function restore(){try{const r=localStorage.getItem(KEY);if(r)apply(JSON.parse(r))}catch(e){}}

/* ---------- 基本の計算 ---------- */
const byId=id=>S.people.find(p=>p.id===id);
const score=p=>p.opp.reduce((a,b)=>a+(b?1:0),0);
const quad=(e,o)=>(e>3?'t':'b')+(o>2?'r':'l');
const lk=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const strength=(a,b)=>S.links[lk(a,b)]||0;
function tierIndex(v){let k=0;S.guide.forEach((g,i)=>{if(g.s<=v)k=i});return k}
const tierText=v=>S.guide[tierIndex(v)].t;

/* ---------- 「?」の説明 ---------- */
function helpData(key,v){
  const H={
   axisE:['縦軸：大切にしたい','<p>あなたの<b>気持ち</b>の強さです。損得は考えず、気持ちだけで付けます。</p><table><tr><th>値</th><th>目安</th></tr><tr><td>1</td><td>あまり意識しない</td></tr><tr><td>2</td><td>少し気になる</td></tr><tr><td>3</td><td>ふつうに好意がある</td></tr><tr><td>4</td><td>大切にしたい</td></tr><tr><td>5</td><td>とても大切にしたい</td></tr></table><p>4〜5が上側、1〜3が下側です。</p>'],
   axisO:['横軸：大切にすべき','<p>次の4項目のうち、当てはまる数(0〜4)です。多いほど右になります。</p><table>'+OPP.map(t=>'<tr><td>□</td><td>'+t+'</td></tr>').join('')+'</table><p>「この縁を活かすべきか」という目安で、気持ちとは別に付けます。3〜4が右側、0〜2が左側です。</p>'],
   links:['つながりの線','<p>知り合い同士の関係の強さを、あなたの主観で0〜100の数字にします。強いほど線が太く濃くなります。</p><p>0は「線なし」です。スイッチで、線をマップに出すかどうかを選べます。</p>'],
   trail:['動きの軌跡','<p>大切にしたい・大切にすべきを変えるたびに、変更前の位置が記録されます。</p><p>人を選ぶと、その人の点がどう動いてきたかを矢印と月で表示します。選んでいないときは、全員の軌跡を薄く表示します。</p>'],
   highlight:['ハイライト','<p>点を押すと、その人とつながっている人だけが濃くなり、他は薄くなります。選んだ人はオレンジで囲まれ、その人の線には強さの数字が付きます。</p><p>同じ点をもう一度押すか「×」で解除します。</p>']
  };
  if(key==='strength'){
    const cur=v==null?-1:tierIndex(v);
    const rows=S.guide.map((g,i)=>{const e=i+1<S.guide.length?S.guide[i+1].s-1:g.s;
      return '<tr class="'+(i===cur?'now':'')+'"><td style="white-space:nowrap">'+(e>g.s?g.s+'〜'+e:g.s)+'</td><td>'+esc(g.t)+'</td></tr>'}).join('');
    return ['関係の強さ（0〜100）','<p>あなたの主観で付ける数字です。'+(v==null?'':'いまは <b>'+v+'</b> で、色の付いた行に当たります。')+'</p><table><tr><th>範囲</th><th>目安</th></tr>'+rows+'</table>',true];
  }
  return H[key];
}
function openHelp(key,v){
  const d=helpData(key,v);
  $('help-t').textContent=d[0];$('help-b').innerHTML=d[1];$('help-set').classList.toggle('hidden',!d[2]);
  $('help').showModal();
}

/* ---------- マップ(画面と画像で同じ描画を使う) ---------- */
const LIGHT={plate:'#f4f4f3',raised:'#ffffff',line:'#dcdddb',grid:'#e8e8e6',plot:'#fafaf9',strong:'#2a2c2e',ink:'#3a3c3f',muted:'#6b6e72',dot:'#8a8d91',noz:'#f26522',nozText:'#b4470f',nozSoft:'#fce4d6'};
function readPal(){
  const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  return {plate:g('--plate'),raised:g('--raised'),line:g('--line'),grid:g('--grid'),plot:g('--plot'),strong:g('--ink-strong'),ink:g('--ink'),
    muted:g('--muted'),dot:g('--dot'),noz:g('--noz'),nozText:g('--noz-text'),nozSoft:g('--noz-soft')};
}
function offsets(items){
  const g={},out={};
  items.forEach(it=>{(g[it.e+','+it.o]=g[it.e+','+it.o]||[]).push(it)});
  Object.values(g).forEach(a=>{const n=a.length;a.forEach((it,i)=>{
    if(n===1){out[it.id]=[0,0];return}
    const r=8+n*2.5,ang=-Math.PI/2+2*Math.PI*i/n;out[it.id]=[Math.cos(ang)*r,Math.sin(ang)*r]})});
  return out;
}
function buildSVG(o){
  const {W,H,s,pal,hdr,hits}=o;
  const k=n=>n*s,f=n=>n.toFixed(1);
  const top=hdr?hdr.h:0;
  const ml=k(44),mr=k(14),mt=top+k(14),mb=k(42),pw=W-ml-mr,ph=H-mt-mb;
  const X0=-.8,X1=4.8,Y0=.2,Y1=5.8;
  const px=v=>ml+(v-X0)/(X1-X0)*pw,py=v=>mt+(Y1-v)/(Y1-Y0)*ph;
  const off=offsets(S.people.map(p=>({id:p.id,e:p.e,o:score(p)})));
  const pos=id=>{const p=byId(id);return[px(score(p))+off[id][0]*s,py(p.e)+off[id][1]*s]};
  const sel=S.sel&&byId(S.sel)?S.sel:null;
  const cx=px(2),cy=py(3);
  const halo=(c)=>' stroke="'+c+'" stroke-width="'+f(k(3))+'" paint-order="stroke" stroke-linejoin="round"';
  const tx=(x,y,t,size,fill,extra)=>'<text x="'+f(x)+'" y="'+f(y)+'" font-size="'+f(k(size))+'" fill="'+fill+'" '+(extra||'')+'>'+t+'</text>';
  let g='<rect width="'+W+'" height="'+H+'" fill="'+pal.raised+'"/>';
  if(hdr){
    g+=tx(ml,k(30),esc(hdr.title),20,pal.strong,'font-weight="500" letter-spacing="'+f(k(1.2))+'"');
    g+='<rect x="'+f(ml)+'" y="'+f(k(38))+'" width="'+f(k(36))+'" height="'+f(k(3))+'" fill="'+pal.noz+'"/>';
    g+=tx(ml,k(66),esc(hdr.stamp),14,pal.ink);
    if(hdr.note)g+=tx(ml,k(84),esc(hdr.note),11,pal.muted);
  }
  g+='<rect x="'+f(ml)+'" y="'+f(mt)+'" width="'+f(pw)+'" height="'+f(ph)+'" fill="'+pal.plot+'" stroke="'+pal.line+'"/>';
  g+='<rect x="'+f(cx)+'" y="'+f(mt)+'" width="'+f(ml+pw-cx)+'" height="'+f(cy-mt)+'" fill="'+pal.nozSoft+'" opacity=".55"/>';
  for(let v=0;v<=4;v++){
    g+='<line x1="'+f(px(v))+'" x2="'+f(px(v))+'" y1="'+f(mt)+'" y2="'+f(mt+ph)+'" stroke="'+pal.grid+'"/>';
    g+=tx(px(v),mt+ph+k(16),v,11,pal.muted,'text-anchor="middle"');
  }
  for(let v=1;v<=5;v++){
    g+='<line x1="'+f(ml)+'" x2="'+f(ml+pw)+'" y1="'+f(py(v))+'" y2="'+f(py(v))+'" stroke="'+pal.grid+'"/>';
    g+=tx(ml-k(8),py(v)+k(4),v,11,pal.muted,'text-anchor="end"');
  }
  g+='<line x1="'+f(cx)+'" x2="'+f(cx)+'" y1="'+f(mt)+'" y2="'+f(mt+ph)+'" stroke="'+pal.muted+'" stroke-width="'+f(k(1.3))+'" opacity=".6"/>';
  g+='<line x1="'+f(ml)+'" x2="'+f(ml+pw)+'" y1="'+f(cy)+'" y2="'+f(cy)+'" stroke="'+pal.muted+'" stroke-width="'+f(k(1.3))+'" opacity=".6"/>';
  g+=tx(ml+pw/2,mt+ph+k(34),'大切にすべき（機会 0〜4）→',12,pal.muted,'text-anchor="middle"');
  g+=tx(0,0,'大切にしたい（気持ち 1〜5）→',12,pal.muted,'text-anchor="middle" transform="translate('+f(k(13))+' '+f(mt+ph/2)+') rotate(-90)"');
  const qx={l:ml+k(8),r:ml+pw-k(8)},qa={l:'start',r:'end'},qy={t:mt+k(16),b:mt+ph-k(20)};
  ['tr','tl','br','bl'].forEach(q=>{
    const c=q==='tr'?pal.nozText:pal.muted;
    g+=tx(qx[q[1]],qy[q[0]],Q[q][0],12,c,'font-weight="700" text-anchor="'+qa[q[1]]+'"');
    g+=tx(qx[q[1]],qy[q[0]]+k(13),Q[q][1],9.5,c,'text-anchor="'+qa[q[1]]+'"');
  });

  if(S.showLinks){
    const mids=[];
    Object.keys(S.links).forEach(key=>{
      const v=S.links[key];if(!v)return;
      const [a,b]=key.split('|');if(!byId(a)||!byId(b))return;
      const [x1,y1]=pos(a),[x2,y2]=pos(b);
      const on=sel&&(a===sel||b===sel);
      const w=k(.8+v/100*5),op=sel?(on?.95:.1):(.3+.55*v/100);
      g+='<line x1="'+f(x1)+'" y1="'+f(y1)+'" x2="'+f(x2)+'" y2="'+f(y2)+'" stroke="'+(on?pal.noz:pal.muted)+'" stroke-width="'+f(w)+'" stroke-linecap="round" opacity="'+op+'"/>';
      if(on)mids.push([(x1+x2)/2,(y1+y2)/2,v]);
    });
    mids.forEach(m=>{g+=tx(m[0],m[1]+k(4),m[2],11,pal.nozText,'text-anchor="middle" font-weight="700"'+halo(pal.plot))});
  }

  function trail(id,faint){
    const h=S.hist[id];if(!h||!h.length)return'';
    const p=byId(id),col=faint?pal.muted:pal.noz,op=faint?.4:.95;
    const pts=h.map(x=>[px(x.o),py(x.e),x.d]).concat([[px(score(p)),py(p.e),null]]);
    let r='';
    for(let i=0;i<pts.length-1;i++){
      const [x1,y1]=pts[i],[x2,y2]=pts[i+1],len=Math.hypot(x2-x1,y2-y1);if(len<2)continue;
      const ux=(x2-x1)/len,uy=(y2-y1)/len,ex=x2-ux*k(9),ey=y2-uy*k(9),hs=k(7);
      r+='<line x1="'+f(x1)+'" y1="'+f(y1)+'" x2="'+f(ex-ux*hs)+'" y2="'+f(ey-uy*hs)+'" stroke="'+col+'" stroke-width="'+f(k(1.5))+'" stroke-dasharray="'+f(k(4))+' '+f(k(3))+'" opacity="'+op+'"/>';
      r+='<polygon points="'+f(ex)+','+f(ey)+' '+f(ex-ux*hs-uy*hs*.5)+','+f(ey-uy*hs+ux*hs*.5)+' '+f(ex-ux*hs+uy*hs*.5)+','+f(ey-uy*hs-ux*hs*.5)+'" fill="'+col+'" opacity="'+op+'"/>';
    }
    if(!faint)pts.slice(0,-1).forEach(q=>{
      r+='<circle cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+f(k(4))+'" fill="'+pal.plot+'" stroke="'+col+'" stroke-width="'+f(k(1.5))+'"/>';
      r+=tx(q[0]+k(7),q[1]-k(6),(+q[2].slice(5,7))+'月',10,pal.muted,halo(pal.plot));
    });
    return r;
  }
  if(S.showTrail){
    if(sel)g+=trail(sel,false);
    else S.people.forEach(p=>{g+=trail(p.id,true)});
  }

  S.people.forEach(p=>{
    const [x,y]=pos(p.id);
    const linked=sel&&strength(sel,p.id)>0,dim=sel&&p.id!==sel&&!linked;
    g+='<g opacity="'+(dim?.28:1)+'">';
    if(p.id===sel)g+='<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(k(12.5))+'" fill="none" stroke="'+pal.noz+'" stroke-width="'+f(k(2.5))+'"/>';
    g+='<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(k(7))+'" fill="'+(p.id===sel?pal.noz:(linked?pal.strong:pal.dot))+'"/>';
    const left=x>ml+pw*.78;
    g+=tx(left?x-k(11):x+k(11),y+k(4),esc(p.name),11.5,pal.strong,'text-anchor="'+(left?'end':'start')+'" font-weight="'+(p.id===sel?700:500)+'"'+halo(pal.plot));
    g+='</g>';
    if(hits)g+='<circle class="hit" data-id="'+esc(p.id)+'" cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(k(17))+'" fill="transparent" style="cursor:pointer"/>';
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic UI, Meiryo, sans-serif">'+g+'</svg>';
}
function drawMap(){
  const box=$('map');
  const W=Math.max(300,Math.floor(box.clientWidth||640));
  const H=Math.round(W<560?W*1.08:Math.min(W*.8,620));
  box.innerHTML=buildSVG({W,H,s:1,pal:readPal(),hdr:null,hits:true});
}

/* ---------- 画像で保存 ---------- */
function download(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function savePng(){
  if(!S.people.length){alert('保存する人がいません。');return}
  const now=new Date(),W=1200,H=1100;
  const svg=buildSVG({W,H,s:1.5,pal:LIGHT,hdr:{h:112,title:'人物ポジショニングマップ',stamp:fmtJP(now),
    note:S.sel&&byId(S.sel)?byId(S.sel).name+' をハイライト中':''},hits:false});
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=W*2;c.height=H*2;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{if(!b){alert('画像の生成に失敗しました。');return}download(b,ymd(now)+'_人物マップ.png')},'image/png');
  };
  img.onerror=()=>alert('画像の生成に失敗しました。');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* ---------- 詳細パネル ---------- */
function histLines(p){
  const pts=(S.hist[p.id]||[]).concat([{d:today(),e:p.e,o:score(p)}]);
  const out=[];
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],parts=[];
    if(a.e!==b.e)parts.push('大切にしたい '+a.e+'→'+b.e);
    if(a.o!==b.o)parts.push('大切にすべき '+a.o+'→'+b.o);
    if(parts.length)out.push('<li><time>'+fmtD(b.d)+'</time><span>'+parts.join('、')+'</span></li>');
  }
  const f0=pts[0];
  return out.reverse().join('')+'<li><time>'+fmtD(f0.d)+'</time><span>記録の開始(大切にしたい '+f0.e+'、大切にすべき '+f0.o+')</span></li>';
}
function linkRow(p,oid){
  const o=byId(oid),v=strength(p.id,oid);
  return '<div class="lrow" data-other="'+esc(oid)+'"><div class="l1"><button class="nm" data-act="goto" data-id="'+esc(oid)+'">'+esc(o.name)+'</button>'+
   '<input class="snum" type="number" min="0" max="100" value="'+v+'" aria-label="'+esc(o.name)+'との強さ"><button class="q" data-help="strength" data-v="'+v+'" aria-label="強さの説明">?</button></div>'+
   '<input class="srange" type="range" min="0" max="100" value="'+v+'" aria-label="'+esc(o.name)+'との強さ"><div class="tier">'+esc(tierText(v))+'</div></div>';
}
function renderPanel(){
  const el=$('panel'),p=S.sel&&byId(S.sel);
  if(!S.people.length){
    el.innerHTML='<div class="empty">まだ誰も登録されていません。<br>「＋ 人を追加」から始めるか、サンプルで操作を試せます。<div class="acts"><button class="btn main" data-act="new">＋ 人を追加</button><button class="btn" data-act="sample">サンプルを入れる</button></div></div>';
    return;
  }
  if(!p){el.innerHTML='<div class="empty">マップの点を押すと、詳細と「つながっている人」の一覧がここに出ます。</div>';return}
  const k=quad(p.e,score(p));
  const linked=S.people.filter(o=>o.id!==p.id&&strength(p.id,o.id)>0).sort((a,b)=>strength(p.id,b.id)-strength(p.id,a.id));
  const free=S.people.filter(o=>o.id!==p.id&&!strength(p.id,o.id));
  el.innerHTML=
   '<div class="ph"><input id="p-name" value="'+esc(p.name)+'" maxlength="40" aria-label="名前"><button class="xbtn" data-act="close" aria-label="選択を解除">×</button></div>'+
   '<span class="badge '+k+'" id="p-badge">'+Q[k][0]+'</span>'+
   '<div><h3 style="font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:8px;color:var(--ink-strong)">大切にしたい（1〜5）<button class="q" data-help="axisE" aria-label="説明">?</button></h3>'+
   '<div class="slide"><input id="p-e" type="range" min="1" max="5" step="1" value="'+p.e+'"><output id="p-eo">'+p.e+'</output></div></div>'+
   '<div class="sec"><h3>大切にすべき（<span id="p-os">'+score(p)+'</span>／4）<button class="q" data-help="axisO" aria-label="説明">?</button></h3>'+
   OPP.map((t,i)=>'<label class="chk"><input type="checkbox" class="p-o" data-i="'+i+'"'+(p.opp[i]?' checked':'')+'>'+t+'</label>').join('')+'</div>'+
   '<div class="sec"><h3>メモ</h3><textarea id="p-memo" aria-label="メモ">'+esc(p.memo)+'</textarea></div>'+
   '<div class="sec"><h3>つながっている人（'+linked.length+'人）<button class="q" data-help="strength" aria-label="強さの説明">?</button></h3>'+
   (linked.length?linked.map(o=>linkRow(p,o.id)).join(''):'<div class="empty" style="padding:6px 0">まだありません。下から追加できます。</div>')+
   (free.length?'<div class="addrow"><select id="p-add" aria-label="つなげる人">'+free.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.name)+'</option>').join('')+'</select><button class="btn" data-act="addlink">つながりを追加</button></div>':'')+
   '<div class="hint">数字を0にすると、つながりを外します。</div></div>'+
   '<div class="sec"><h3>動きの履歴<button class="q" data-help="trail" aria-label="説明">?</button></h3><ul class="hist" id="p-hist">'+histLines(p)+'</ul></div>'+
   '<div class="sec"><button class="del" data-act="del">この人を削除</button></div>';
}
function refreshHead(p){
  const k=quad(p.e,score(p)),b=$('p-badge');
  if(b){b.textContent=Q[k][0];b.className='badge '+k}
  const o=$('p-os');if(o)o.textContent=score(p);
}
function pushHist(p,before){
  if(before.e===p.e&&before.o===score(p))return;
  (S.hist[p.id]=S.hist[p.id]||[]).push({d:today(),e:before.e,o:before.o});
}

/* ---------- 設定 ---------- */
function renderSet(){
  $('set-rows').innerHTML=S.guide.map((g,i)=>'<tr><td><input class="gs" type="number" min="0" max="100" value="'+g.s+'"'+(i===0?' disabled':'')+' aria-label="開始値"></td>'+
    '<td><input class="gt" value="'+esc(g.t)+'" aria-label="説明"></td><td>'+(i?'<button class="btn" data-gdel="'+i+'">削除</button>':'')+'</td></tr>').join('');
}
function commitSet(){
  const rows=[...document.querySelectorAll('#set-rows tr')].map(tr=>({s:Math.max(0,Math.min(100,parseInt(tr.querySelector('.gs').value,10)||0)),t:tr.querySelector('.gt').value.trim()||'(説明なし)'}));
  rows[0].s=0;
  const seen={};
  S.guide=rows.sort((a,b)=>a.s-b.s).filter(r=>{if(seen[r.s])return false;seen[r.s]=1;return true});
  persist();renderSet();renderPanel();
}

/* ---------- イベント ---------- */
function render(){renderPanel();drawMap()}
function select(id){S.sel=id;renderPanel();drawMap()}
function addPerson(){
  const id='n'+uid();
  S.people.push({id,name:'新しい人',e:3,opp:[0,0,0,0],memo:''});
  persist();select(id);
  const n=$('p-name');if(n){n.focus();n.select()}
  if(window.innerWidth<=860)$('panel').scrollIntoView({behavior:'smooth',block:'start'});
}
document.addEventListener('click',ev=>{
  const t=ev.target;
  const hit=t.closest&&t.closest('.hit');
  if(hit){const id=hit.getAttribute('data-id');select(S.sel===id?null:id);
    if(S.sel&&window.innerWidth<=860)$('panel').scrollIntoView({behavior:'smooth',block:'start'});return}
  const q=t.closest&&t.closest('[data-help]');
  if(q){const key=q.getAttribute('data-help'),v=q.getAttribute('data-v');openHelp(key,v==null?null:+v);return}
  const a=t.closest&&t.closest('[data-act]');
  if(a){
    const act=a.getAttribute('data-act'),p=S.sel&&byId(S.sel);
    if(act==='close')select(null);
    if(act==='new')addPerson();
    if(act==='sample')loadSample();
    if(act==='goto')select(a.getAttribute('data-id'));
    if(act==='addlink'&&p){S.links[lk(p.id,$('p-add').value)]=1;persist();renderPanel();drawMap()}
    if(act==='del'&&p){
      if(a.getAttribute('data-ok')!=='1'){a.textContent='もう一度押すと削除します';a.setAttribute('data-ok','1');return}
      S.people=S.people.filter(x=>x.id!==p.id);
      Object.keys(S.links).forEach(key=>{if(key.split('|').includes(p.id))delete S.links[key]});
      delete S.hist[p.id];persist();select(null);
    }
    return;
  }
  const gd=t.closest&&t.closest('[data-gdel]');
  if(gd){S.guide.splice(+gd.getAttribute('data-gdel'),1);persist();renderSet();renderPanel()}
});
$('panel').addEventListener('input',ev=>{
  const t=ev.target,p=byId(S.sel);if(!p)return;
  if(t.id==='p-name'){p.name=t.value.trim()||'名前なし';persist();drawMap();return}
  if(t.id==='p-e'){p.e=+t.value;$('p-eo').textContent=t.value;refreshHead(p);persist();drawMap();return}
  if(t.id==='p-memo'){p.memo=t.value;persist();return}
  const row=t.closest('.lrow');
  if(row&&(t.classList.contains('srange')||t.classList.contains('snum'))){
    const v=Math.max(0,Math.min(100,parseInt(t.value,10)||0));
    S.links[lk(p.id,row.getAttribute('data-other'))]=v;
    row.querySelector('.srange').value=v;
    if(t.classList.contains('srange'))row.querySelector('.snum').value=v;
    row.querySelector('.tier').textContent=tierText(v);
    row.querySelector('.q').setAttribute('data-v',v);
    persist();drawMap();
  }
});
let eStart=null;
const startE=()=>{const p=byId(S.sel);if(p&&!eStart)eStart={e:p.e,o:score(p)}};
$('panel').addEventListener('pointerdown',ev=>{if(ev.target.id==='p-e')startE()});
$('panel').addEventListener('keydown',ev=>{if(ev.target.id==='p-e')startE()});
$('panel').addEventListener('change',ev=>{
  const t=ev.target,p=byId(S.sel);if(!p)return;
  if(t.id==='p-e'&&eStart){pushHist(p,eStart);eStart=null;persist();$('p-hist').innerHTML=histLines(p);drawMap();return}

    const b={e:p.e,o:score(p)};p.opp[+t.getAttribute('data-i')]=t.checked?1:0;
    pushHist(p,b);persist();refreshHead(p);drawMap();$('p-hist').innerHTML=histLines(p);return;
  }
  if(t.classList.contains('srange')||t.classList.contains('snum'))renderPanel();
});

let rt;
const redraw=()=>{clearTimeout(rt);rt=setTimeout(drawMap,60)};
if('ResizeObserver' in window)new ResizeObserver(redraw).observe($('map'));else window.addEventListener('resize',redraw);
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw)}catch(e){}
try{new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}

restore();
$('t-links').checked=S.showLinks;$('t-trail').checked=S.showTrail;
render();
try{
  if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
}catch(e){}
})();
</script>
</body>
