<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人物ポジショニングマップ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人物マップ">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --fg:#2b2b2b; --sub:#76726b; --line:#dedbd5;
  --accent:#c4572d; --accent-tint:rgba(196,87,45,.09); --btn:#2b2b2b; --btn-fg:#fff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161617; --card:#1f1f21; --fg:#e8e6e1; --sub:#9a968f; --line:#3a3a3e;
    --accent:#e8875c; --accent-tint:rgba(232,135,92,.13); --btn:#e8e6e1; --btn-fg:#161617;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:12px 16px 48px}
h1{font-size:18px;margin:8px 0 2px}
.lead{margin:0 0 12px;color:var(--sub);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--sub)}
button.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
button.danger{color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.insight{border-left:4px solid var(--fg)}
.insight h2{font-size:14px;margin:0 0 6px}
.insight .ok{color:var(--sub);font-size:13px;margin:0}
.insight ul{list-style:none;margin:0;padding:0}
.insight li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.insight li:first-child{border-top:0}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{flex:1;border-radius:8px}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;min-height:40px;max-width:100%}
#map{width:100%;touch-action:manipulation}
#map svg{display:block;width:100%;height:auto}
.note{font-size:12px;color:var(--sub);margin:6px 0 0}
.changes{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.changes li{padding:4px 0;border-top:1px solid var(--line)}
.group{margin-bottom:14px}
.group h3{font-size:14px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.group h3 small{color:var(--sub);font-weight:400}
.group.tr h3{color:var(--accent)}
.group.tr .item{border-left:3px solid var(--accent)}
.item{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;align-items:center}
.item .n{font-weight:700}
.item .m{color:var(--sub);font-size:12px}
.tag{font-size:11px;font-weight:700;border:1px solid var(--fg);border-radius:999px;padding:0 8px;white-space:nowrap}
.empty{color:var(--sub);font-size:13px;padding:8px 2px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:0;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form.edit{padding:16px;display:flex;flex-direction:column;gap:14px}
form.edit h2{margin:0;font-size:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
label.f input[type=text],label.f input[type=date],label.f textarea{
  border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--fg);font-size:16px;min-height:40px}
label.f textarea{min-height:80px;resize:vertical}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1}
.slider output{font-size:20px;font-weight:700;color:var(--fg);min-width:1.5em;text-align:center}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 12px}
legend{font-size:13px;color:var(--sub);padding:0 4px}
fieldset label{display:flex;gap:8px;align-items:center;padding:6px 0;min-height:36px}
fieldset input{width:20px;height:20px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .sp{flex:1}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>人物ポジショニングマップ</h1>
  <p class="lead">気持ちと機会の2軸で知り合いを整理し、時間の使い方のズレに気づくための個人用ツール。データはこの端末の中だけに保存されます。</p>

  <div class="bar">
    <button class="primary" id="btn-add">＋ 人を追加</button>
    <button id="btn-snap">スナップショット保存</button>
    <button id="btn-png">画像で保存</button>
    <button id="btn-csv-out">CSV出力</button>
    <button id="btn-csv-in">CSV読込</button>
    <input type="file" id="file-csv" accept=".csv,text/csv" class="hidden">
  </div>

  <section class="card insight" id="insight"></section>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-map" aria-selected="true">マップ</button>
    <button role="tab" id="tab-list" aria-selected="false">一覧</button>
  </div>

  <section id="pane-map" class="card">
    <div class="row">
      <label for="snap-select" style="font-size:13px;color:var(--sub)">過去と比較</label>
      <select id="snap-select"></select>
      <button id="btn-snap-del" class="hidden">このスナップショットを削除</button>
    </div>
    <div id="map"></div>
    <p class="note" id="map-note"></p>
    <ul class="changes" id="changes"></ul>
  </section>

  <section id="pane-list" class="hidden">
    <div class="row">
      <label for="sort-select" style="font-size:13px;color:var(--sub)">並べ替え</label>
      <select id="sort-select">
        <option value="old">最後に会った日（古い順）</option>
        <option value="new">最後に会った日（新しい順）</option>
        <option value="name">名前順</option>
      </select>
    </div>
    <div id="list"></div>
  </section>
</div>

<dialog id="dlg">
  <form class="edit" id="form" method="dialog" novalidate>
    <h2 id="dlg-title">人を追加</h2>
    <label class="f">名前（イニシャル可）
      <input type="text" id="f-name" maxlength="40" autocomplete="off">
    </label>
    <label class="f">大切にしたい（感情） 1〜5
      <div class="slider">
        <input type="range" id="f-emotion" min="1" max="5" step="1" value="3">
        <output id="f-emotion-out">3</output>
      </div>
    </label>
    <fieldset>
      <legend>大切にすべき（機会）：<span id="f-score">0</span> / 4</legend>
      <label><input type="checkbox" class="opp"> イベントに誘える</label>
      <label><input type="checkbox" class="opp"> 仕事の可能性がある</label>
      <label><input type="checkbox" class="opp"> 人を紹介してくれそう</label>
      <label><input type="checkbox" class="opp"> 情報や知識をくれる</label>
    </fieldset>
    <label class="f">最後に会った日
      <div class="row" style="margin:0">
        <input type="date" id="f-last" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);font-size:16px;min-height:40px">
        <button type="button" id="f-today">今日</button>
      </div>
    </label>
    <label class="f">メモ
      <textarea id="f-memo" maxlength="500"></textarea>
    </label>
    <div class="actions">
      <button type="button" id="f-del" class="danger">削除</button>
      <span class="sp"></span>
      <button type="button" id="f-cancel">キャンセル</button>
      <button type="submit" class="primary" id="f-save">保存</button>
    </div>
  </form>
</dialog>

<script>
(function(){
'use strict';

/* ---------- 定数 ---------- */
const STORE_KEY = 'positioning-map.v1';
const CENTER_E = 3;      // 縦軸の中央線（感情）
const CENTER_O = 2;      // 横軸の中央線（機会）
const STALE_DAYS = 90;   // 「最近会えていない」の閾値
// 中央線上の人は低い側（左・下）に入れる。変えたい場合は quadOf の > を >= にする。
const OPP_LABELS = ['イベントに誘える','仕事の可能性がある','人を紹介してくれそう','情報や知識をくれる'];
const QUADS = {
  tr:{name:'一番大事な人',   sub:'一緒に挑戦したい'},
  tl:{name:'純粋に大切な人', sub:'損得で見ない'},
  br:{name:'縁をつなぐ人',   sub:'定期的に連絡・誘う'},
  bl:{name:'自然体でいい人', sub:'無理せず付き合う'}
};
const QUAD_ORDER = ['tr','tl','br','bl'];
const FONT = '"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif';

const PALETTES = {
  light:{bg:'#ffffff',plot:'#faf9f7',axis:'#b9b5ad',grid:'#e6e3dd',text:'#2b2b2b',sub:'#76726b',
         dot:'#8a8680',accent:'#c4572d',tint:'rgba(196,87,45,0.09)'},
  dark: {bg:'#1f1f21',plot:'#262628',axis:'#5a5a60',grid:'#333337',text:'#e8e6e1',sub:'#9a968f',
         dot:'#8d8a84',accent:'#e8875c',tint:'rgba(232,135,92,0.14)'}
};
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
const curPal = () => darkMQ.matches ? PALETTES.dark : PALETTES.light;

/* ---------- ユーティリティ ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtJP = d => d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes())+' 時点';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const oppScore = p => p.opp.filter(Boolean).length;
const quadOf = (e,o) => (e > CENTER_E ? 't' : 'b') + (o > CENTER_O ? 'r' : 'l');
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

function daysSince(s){
  if(!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return null;
  const t = new Date(+m[1], +m[2]-1, +m[3]);
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((today - t) / 864e5);
}
function normDate(v){
  const m = /^\s*(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/.exec(v || '');
  return m ? m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]) : '';
}
const isStale = p => quadOf(p.emotion, oppScore(p)) === 'tl' && (daysSince(p.last) ?? -1) >= STALE_DAYS;

/* ---------- 状態と保存 ---------- */
let state = {people:[], snapshots:[]};
const view = {tab:'map', snapId:'', sort:'old'};
let saveWarned = false;

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.people = Array.isArray(d.people) ? d.people : [];
      state.snapshots = Array.isArray(d.snapshots) ? d.snapshots : [];
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){
    if(!saveWarned){ saveWarned = true; alert('この環境ではデータを保存できません（プライベートモードなど）。CSV出力でバックアップしてください。'); }
  }
}

/* ---------- マップ描画（画面・画像で共通） ---------- */
// 同じ座標の人を小さな円周上にずらす
function offsets(items){
  const g = {}, out = {};
  items.forEach(it => { (g[it.e+','+it.o] = g[it.e+','+it.o] || []).push(it); });
  Object.values(g).forEach(a => {
    const n = a.length;
    a.forEach((it,i) => {
      if(n === 1){ out[it.id] = [0,0]; return; }
      const r = 8 + n*2.5, ang = -Math.PI/2 + 2*Math.PI*i/n;
      out[it.id] = [Math.cos(ang)*r, Math.sin(ang)*r];
    });
  });
  return out;
}

// o: {W,H,s,pal,items:[{id,name,e,o,flag}], cur:{id:{e,o,dx,dy}}|null, header:{h,title,stamp,note}|null}
function buildSVG(o){
  const {W,H,s,pal,items,cur,header} = o;
  const top = header ? header.h : 0;
  const ml = 44*s, mr = 14*s, mt = top + 14*s, mb = 42*s;
  const pw = W - ml - mr, ph = H - mt - mb;
  const X0=-0.8, X1=4.8, Y0=0.2, Y1=5.8;
  const px = v => ml + (v-X0)/(X1-X0)*pw;
  const py = v => mt + (Y1-v)/(Y1-Y0)*ph;
  const cx = px(CENTER_O), cy = py(CENTER_E);
  const off = offsets(items);
  const f = (n) => n.toFixed(1);
  let g = '';

  g += '<rect width="'+W+'" height="'+H+'" fill="'+pal.bg+'"/>';
  if(header){
    g += '<text x="'+ml+'" y="38" font-size="26" font-weight="700" fill="'+pal.text+'">'+esc(header.title)+'</text>';
    g += '<text x="'+ml+'" y="64" font-size="17" fill="'+pal.text+'">'+esc(header.stamp)+'</text>';
    if(header.note) g += '<text x="'+ml+'" y="86" font-size="13" fill="'+pal.sub+'">'+esc(header.note)+'</text>';
  }
  g += '<rect x="'+f(ml)+'" y="'+f(mt)+'" width="'+f(pw)+'" height="'+f(ph)+'" fill="'+pal.plot+'" stroke="'+pal.grid+'"/>';
  g += '<rect x="'+f(cx)+'" y="'+f(mt)+'" width="'+f(ml+pw-cx)+'" height="'+f(cy-mt)+'" fill="'+pal.tint+'"/>';

  // 目盛り
  for(let v=0; v<=4; v++){
    g += '<line x1="'+f(px(v))+'" x2="'+f(px(v))+'" y1="'+f(mt)+'" y2="'+f(mt+ph)+'" stroke="'+pal.grid+'" stroke-width="1"/>';
    g += '<text x="'+f(px(v))+'" y="'+f(mt+ph+16*s)+'" font-size="'+f(11*s)+'" text-anchor="middle" fill="'+pal.sub+'">'+v+'</text>';
  }
  for(let v=1; v<=5; v++){
    g += '<line x1="'+f(ml)+'" x2="'+f(ml+pw)+'" y1="'+f(py(v))+'" y2="'+f(py(v))+'" stroke="'+pal.grid+'" stroke-width="1"/>';
    g += '<text x="'+f(ml-8*s)+'" y="'+f(py(v)+4*s)+'" font-size="'+f(11*s)+'" text-anchor="end" fill="'+pal.sub+'">'+v+'</text>';
  }
  // 中央線
  g += '<line x1="'+f(cx)+'" x2="'+f(cx)+'" y1="'+f(mt)+'" y2="'+f(mt+ph)+'" stroke="'+pal.axis+'" stroke-width="1.5"/>';
  g += '<line x1="'+f(ml)+'" x2="'+f(ml+pw)+'" y1="'+f(cy)+'" y2="'+f(cy)+'" stroke="'+pal.axis+'" stroke-width="1.5"/>';

  // 軸ラベル
  g += '<text x="'+f(ml+pw/2)+'" y="'+f(mt+ph+34*s)+'" font-size="'+f(12*s)+'" text-anchor="middle" fill="'+pal.sub+'">大切にすべき（機会）　0〜4 →</text>';
  g += '<text transform="translate('+f(13*s)+' '+f(mt+ph/2)+') rotate(-90)" font-size="'+f(12*s)+'" text-anchor="middle" fill="'+pal.sub+'">大切にしたい（感情）　1〜5 →</text>';

  // 象限ラベル
  const qx = {l:ml+8*s, r:ml+pw-8*s}, qa = {l:'start', r:'end'};
  const qy = {t:mt+16*s, b:mt+ph-20*s};
  QUAD_ORDER.forEach(k => {
    const v = k[0], h = k[1];
    const col = k === 'tr' ? pal.accent : pal.sub;
    g += '<text x="'+f(qx[h])+'" y="'+f(qy[v])+'" font-size="'+f(12*s)+'" font-weight="700" text-anchor="'+qa[h]+'" fill="'+col+'">'+QUADS[k].name+'</text>';
    g += '<text x="'+f(qx[h])+'" y="'+f(qy[v]+13*s)+'" font-size="'+f(9.5*s)+'" text-anchor="'+qa[h]+'" fill="'+col+'">'+QUADS[k].sub+'</text>';
  });

  // 変化の矢印（スナップショット表示時）
  const pos = it => [px(it.o)+off[it.id][0]*s, py(it.e)+off[it.id][1]*s];
  if(cur){
    items.forEach(it => {
      const c = cur[it.id];
      if(!c || (c.e === it.e && c.o === it.o)) return;
      const [x1,y1] = pos(it);
      const x2 = px(c.o)+c.dx*s, y2 = py(c.e)+c.dy*s;
      const len = Math.hypot(x2-x1, y2-y1) || 1;
      const ux = (x2-x1)/len, uy = (y2-y1)/len;
      const r = 5*s, ex = x2-ux*r, ey = y2-uy*r;     // 矢印の先端は現在位置の輪の手前
      const sx = x1+ux*6*s, sy = y1+uy*6*s;
      const hs = 7*s;
      const hx = ex-ux*hs, hy = ey-uy*hs, nx = -uy*hs*0.5, ny = ux*hs*0.5;
      g += '<line x1="'+f(sx)+'" y1="'+f(sy)+'" x2="'+f(hx)+'" y2="'+f(hy)+'" stroke="'+pal.text+'" stroke-width="'+f(1.5*s)+'"/>';
      g += '<polygon points="'+f(ex)+','+f(ey)+' '+f(hx+nx)+','+f(hy+ny)+' '+f(hx-nx)+','+f(hy-ny)+'" fill="'+pal.text+'"/>';
      g += '<circle cx="'+f(x2)+'" cy="'+f(y2)+'" r="'+f(4.5*s)+'" fill="none" stroke="'+pal.text+'" stroke-width="'+f(1.5*s)+'"/>';
    });
  }

  // 点と名前
  items.forEach(it => {
    const [x,y] = pos(it);
    const isTR = quadOf(it.e, it.o) === 'tr';
    const fill = isTR ? pal.accent : pal.dot;
    if(it.flag) g += '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(10*s)+'" fill="none" stroke="'+pal.text+'" stroke-width="'+f(1.5*s)+'" stroke-dasharray="'+f(3*s)+' '+f(2.5*s)+'"/>';
    g += '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(6*s)+'" fill="'+fill+'"/>';
    const left = x > ml + pw*0.78;
    g += '<text x="'+f(left ? x-10*s : x+10*s)+'" y="'+f(y+4*s)+'" font-size="'+f(11.5*s)+'" text-anchor="'+(left?'end':'start')+'" fill="'+pal.text+'" stroke="'+pal.plot+'" stroke-width="'+f(3*s)+'" paint-order="stroke" stroke-linejoin="round">'+esc(it.name)+'</text>';
    g += '<circle class="hit" data-id="'+esc(it.id)+'" cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(15*s)+'" fill="transparent" style="cursor:pointer"/>';
  });

  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family=\''+FONT.replace(/"/g,'&quot;')+'\'>'+g+'</svg>';
}

/* ---------- 表示用のデータ組み立て ---------- */
const currentSnap = () => state.snapshots.find(s => s.id === view.snapId) || null;

function currentItems(){
  return state.people.map(p => ({id:p.id, name:p.name, e:p.emotion, o:oppScore(p), flag:isStale(p)}));
}
function mapModel(){
  const snap = currentSnap();
  const curItems = currentItems();
  if(!snap) return {items:curItems, cur:null, snap:null};
  const co = offsets(curItems), cur = {};
  curItems.forEach(it => { cur[it.id] = {e:it.e, o:it.o, dx:co[it.id][0], dy:co[it.id][1]}; });
  const items = snap.people.map(p => ({id:p.id, name:p.name, e:p.e, o:p.o, flag:false}));
  return {items, cur, snap};
}

/* ---------- 画面描画 ---------- */
function renderInsight(){
  const stale = state.people.filter(isStale)
    .sort((a,b) => (daysSince(b.last)) - (daysSince(a.last)));
  let h;
  if(!state.people.length){
    h = '<p class="ok">まだ誰も登録されていません。「＋ 人を追加」から始めましょう。</p>';
  }else if(!stale.length){
    h = '<h2>最近会えていない大切な人</h2><p class="ok">該当なし（純粋に大切な人で、'+STALE_DAYS+'日以上会っていない人はいません）</p>';
  }else{
    h = '<h2>最近会えていない大切な人（'+stale.length+'人）</h2><ul>' + stale.map(p =>
      '<li><button class="linkbtn" data-edit="'+esc(p.id)+'" style="border:0;background:none;padding:0;min-height:32px;text-align:left"><b>'+esc(p.name)+'</b></button>'+
      '<span class="tag">'+daysSince(p.last)+'日会っていない</span></li>').join('') + '</ul>';
  }
  $('insight').innerHTML = h;
}

function mapSize(){
  const w = Math.max(300, Math.floor($('map').clientWidth || 360));
  const h = Math.round(w < 560 ? w*1.12 : Math.min(w*0.74, 620));
  return [w,h];
}

function renderMap(){
  const m = mapModel();
  const [W,H] = mapSize();
  $('map').innerHTML = buildSVG({W,H,s:1,pal:curPal(),items:m.items,cur:m.cur,header:null});

  const sel = $('snap-select');
  sel.innerHTML = '<option value="">現在の配置</option>' + state.snapshots.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s => {
    const d = new Date(s.date);
    return '<option value="'+esc(s.id)+'"'+(s.id===view.snapId?' selected':'')+'>'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'（'+s.people.length+'人）</option>';
  }).join('');
  $('btn-snap-del').classList.toggle('hidden', !m.snap);

  const ch = $('changes');
  if(m.snap){
    $('map-note').textContent = fmtJP(new Date(m.snap.date)) + 'の配置です。● 当時の位置 → ○ 現在の位置（矢印は動いた人のみ）。';
    const rows = [];
    let gone = 0;
    m.snap.people.forEach(p => {
      const c = m.cur[p.id];
      if(!c){ gone++; return; }
      if(c.e === p.e && c.o === p.o) return;
      const from = QUADS[quadOf(p.e,p.o)].name, to = QUADS[quadOf(c.e,c.o)].name;
      const parts = [];
      if(c.e !== p.e) parts.push('感情 '+p.e+'→'+c.e);
      if(c.o !== p.o) parts.push('機会 '+p.o+'→'+c.o);
      rows.push('<li><b>'+esc(p.name)+'</b>　'+parts.join('、')+(from!==to?'（'+from+' → '+to+'）':'')+'</li>');
    });
    const added = state.people.filter(p => !m.snap.people.some(q => q.id === p.id)).length;
    const foot = [];
    if(added) foot.push('当時はいなかった人：'+added+'人');
    if(gone) foot.push('その後削除された人：'+gone+'人');
    ch.innerHTML = (rows.length ? rows.join('') : '<li>位置が変わった人はいません。</li>') + (foot.length ? '<li class="m" style="color:var(--sub)">'+foot.join('／')+'</li>' : '');
  }else{
    $('map-note').textContent = '点をタップすると詳細と編集画面が開きます。破線の輪は「最近会えていない大切な人」です。';
    ch.innerHTML = '';
  }
}

function renderList(){
  const groups = {tr:[],tl:[],br:[],bl:[]};
  state.people.forEach(p => groups[quadOf(p.emotion, oppScore(p))].push(p));
  const cmp = {
    old:(a,b)=>{ const x=daysSince(a.last), y=daysSince(b.last);
      if(x===null && y===null) return a.name.localeCompare(b.name,'ja');
      if(x===null) return 1; if(y===null) return -1; return y-x; },
    new:(a,b)=>{ const x=daysSince(a.last), y=daysSince(b.last);
      if(x===null && y===null) return a.name.localeCompare(b.name,'ja');
      if(x===null) return 1; if(y===null) return -1; return x-y; },
    name:(a,b)=>a.name.localeCompare(b.name,'ja')
  }[view.sort];
  $('list').innerHTML = QUAD_ORDER.map(k => {
    const a = groups[k].sort(cmp);
    return '<div class="group '+k+'"><h3>'+QUADS[k].name+'<small>'+QUADS[k].sub+'・'+a.length+'人</small></h3>' +
      (a.length ? a.map(p => {
        const d = daysSince(p.last);
        const last = p.last ? p.last.replace(/-/g,'/')+'（'+d+'日前）' : '日付未入力';
        return '<button class="item" data-edit="'+esc(p.id)+'"><span><span class="n">'+esc(p.name)+'</span><br><span class="m">感情 '+p.emotion+'／機会 '+oppScore(p)+'／'+last+'</span></span>'+
          (isStale(p)?'<span class="tag">要連絡</span>':'')+'</button>';
      }).join('') : '<div class="empty">該当なし</div>') + '</div>';
  }).join('');
}

function render(){
  renderInsight();
  renderMap();
  renderList();
}

function setTab(t){
  view.tab = t;
  $('tab-map').setAttribute('aria-selected', t==='map');
  $('tab-list').setAttribute('aria-selected', t==='list');
  $('pane-map').classList.toggle('hidden', t!=='map');
  $('pane-list').classList.toggle('hidden', t!=='list');
  if(t==='map') renderMap();
}

/* ---------- 追加・編集ダイアログ ---------- */
let editingId = null;
const dlg = $('dlg');
const oppBoxes = () => Array.from(document.querySelectorAll('.opp'));
function updateScore(){ $('f-score').textContent = oppBoxes().filter(b=>b.checked).length; }

function openEdit(id){
  editingId = id;
  const p = id ? state.people.find(x => x.id === id) : null;
  $('dlg-title').textContent = p ? '詳細・編集' : '人を追加';
  $('f-name').value = p ? p.name : '';
  $('f-emotion').value = p ? p.emotion : 3;
  $('f-emotion-out').textContent = $('f-emotion').value;
  oppBoxes().forEach((b,i) => b.checked = p ? !!p.opp[i] : false);
  updateScore();
  $('f-last').value = p ? p.last : '';
  $('f-memo').value = p ? p.memo : '';
  $('f-del').classList.toggle('hidden', !p);
  dlg.showModal();
  if(!p) $('f-name').focus();
}
function closeEdit(){ if(dlg.open) dlg.close(); }

function submitEdit(ev){
  ev.preventDefault();
  const name = $('f-name').value.trim();
  if(!name){ $('f-name').focus(); alert('名前（イニシャル可）を入力してください。'); return; }
  const rec = {
    name,
    emotion: clamp(parseInt($('f-emotion').value,10) || 3, 1, 5),
    opp: oppBoxes().map(b => b.checked),
    last: $('f-last').value || '',
    memo: $('f-memo').value.trim()
  };
  if(editingId){
    Object.assign(state.people.find(x => x.id === editingId), rec);
  }else{
    state.people.push(Object.assign({id:uid()}, rec));
  }
  save(); closeEdit(); render();
}

/* ---------- スナップショット ---------- */
function takeSnapshot(){
  if(!state.people.length){ alert('保存する人がいません。'); return; }
  const s = {id:uid(), date:new Date().toISOString(),
    people: state.people.map(p => ({id:p.id, name:p.name, e:p.emotion, o:oppScore(p)}))};
  state.snapshots.push(s);
  view.snapId = '';
  save(); render();
  alert('スナップショットを保存しました（'+fmtJP(new Date(s.date)).replace(' 時点','')+'）。');
}
function deleteSnapshot(){
  const s = currentSnap();
  if(!s || !confirm('このスナップショットを削除しますか？')) return;
  state.snapshots = state.snapshots.filter(x => x.id !== s.id);
  view.snapId = '';
  save(); render();
}

/* ---------- 画像で保存 ---------- */
function saveImage(){
  const m = mapModel();
  if(!m.items.length){ alert('保存する人がいません。'); return; }
  const when = m.snap ? new Date(m.snap.date) : new Date();
  const W = 1200, H = 1060, s = 1.5;
  const svg = buildSVG({W,H,s,pal:PALETTES.light,items:m.items,cur:m.cur,
    header:{h:104, title:'人物ポジショニングマップ', stamp:fmtJP(when),
            note:m.snap ? 'スナップショット表示：● 当時の位置 → ○ 現在の位置' : ''}});
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = W*2; c.height = H*2;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(blob => {
      if(!blob){ alert('画像の生成に失敗しました。'); return; }
      download(blob, ymd(when)+'_人物マップ.png');
    }, 'image/png');
  };
  img.onerror = () => alert('画像の生成に失敗しました。');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- CSV ---------- */
function toCSV(){
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const head = ['id','名前','感情(1-5)'].concat(OPP_LABELS, ['最後に会った日','メモ']);
  const rows = state.people.map(p => [p.id, p.name, p.emotion]
    .concat(p.opp.map(b => b ? 1 : 0), [p.last, p.memo]));
  return '﻿' + [head].concat(rows).map(r => r.map(q).join(',')).join('\r\n');
}
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cur = '', inQ = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    }else if(ch === '"') inQ = true;
    else if(ch === ','){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    }else cur += ch;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
function importCSV(text){
  const rows = parseCSV(text);
  if(rows.length < 2){ alert('データ行が見つかりません。'); return; }
  const head = rows[0].map(h => h.trim());
  const col = pred => head.findIndex(pred);
  const iId = col(h => h.toLowerCase() === 'id');
  const iName = col(h => h === '名前');
  const iEmo = col(h => h.startsWith('感情'));
  const iOpp = OPP_LABELS.map(l => col(h => h === l));
  const iLast = col(h => h === '最後に会った日');
  const iMemo = col(h => h === 'メモ');
  if(iName < 0){ alert('「名前」列が見つかりません。1行目は見出しにしてください。'); return; }
  const yes = v => /^(1|true|yes|y|○|〇|✓|✔|有|はい)$/i.test((v || '').trim());
  let added = 0, updated = 0;
  rows.slice(1).forEach(r => {
    const name = (r[iName] || '').trim();
    if(!name) return;
    const emo = clamp(Math.round(parseFloat(r[iEmo])) || 3, 1, 5);
    const rec = {
      name, emotion: emo,
      opp: iOpp.map(i => i >= 0 && yes(r[i])),
      last: iLast >= 0 ? normDate(r[iLast]) : '',
      memo: iMemo >= 0 ? (r[iMemo] || '').trim() : ''
    };
    const id = iId >= 0 ? (r[iId] || '').trim() : '';
    const hit = id && state.people.find(p => p.id === id);
    if(hit){ Object.assign(hit, rec); updated++; }
    else{ state.people.push(Object.assign({id: id || uid()}, rec)); added++; }
  });
  save(); render();
  alert('CSVを読み込みました。追加 '+added+'件／更新 '+updated+'件（idが一致する行は上書き、削除は反映されません）。');
}

/* ---------- イベント ---------- */
$('btn-add').onclick = () => openEdit(null);
$('btn-snap').onclick = takeSnapshot;
$('btn-snap-del').onclick = deleteSnapshot;
$('btn-png').onclick = saveImage;
$('btn-csv-out').onclick = () => {
  if(!state.people.length){ alert('出力するデータがありません。'); return; }
  download(new Blob([toCSV()], {type:'text/csv;charset=utf-8'}), ymd(new Date())+'_人物マップ.csv');
};
$('btn-csv-in').onclick = () => $('file-csv').click();
$('file-csv').onchange = ev => {
  const f = ev.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => importCSV(String(rd.result));
  rd.readAsText(f, 'utf-8');
  ev.target.value = '';
};
$('tab-map').onclick = () => setTab('map');
$('tab-list').onclick = () => setTab('list');
$('snap-select').onchange = ev => { view.snapId = ev.target.value; renderMap(); };
$('sort-select').onchange = ev => { view.sort = ev.target.value; renderList(); };

$('f-emotion').oninput = ev => { $('f-emotion-out').textContent = ev.target.value; };
oppBoxes().forEach(b => b.onchange = updateScore);
$('f-today').onclick = () => { $('f-last').value = ymd(new Date()); };
$('f-cancel').onclick = closeEdit;
$('f-del').onclick = () => {
  const p = state.people.find(x => x.id === editingId);
  if(p && confirm('「'+p.name+'」を削除しますか？')){
    state.people = state.people.filter(x => x.id !== editingId);
    save(); closeEdit(); render();
  }
};
$('form').addEventListener('submit', submitEdit);

document.addEventListener('click', ev => {
  const hit = ev.target.closest && ev.target.closest('.hit');
  if(hit){
    const id = hit.getAttribute('data-id');
    if(state.people.some(p => p.id === id)) openEdit(id);
    else alert('この人は現在のデータから削除されています。');
    return;
  }
  const b = ev.target.closest && ev.target.closest('[data-edit]');
  if(b) openEdit(b.getAttribute('data-edit'));
});

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if(view.tab==='map') renderMap(); }, 120); });
darkMQ.addEventListener && darkMQ.addEventListener('change', renderMap);

load();
render();
if("serviceWorker" in navigator && location.protocol !== "file:"){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
})();
</script>
